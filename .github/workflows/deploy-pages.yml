name: Deploy Pages Branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: install-swift-sdk
        uses: swiftwasm/setup-swiftwasm@v2
        with:
          tag: "swift-6.3-RELEASE"
          target: "wasm32-unknown-wasip1-threads"

      - name: Install WebAssembly optimization tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen

      - name: Build Swift/Wasm bundle
        run: swift package --swift-sdk "${{ steps.install-swift-sdk.outputs.swift-sdk-id }}" js -c release

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Publish dist to deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: deploy
          force_orphan: true
