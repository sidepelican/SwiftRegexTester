name: Deploy Pages Branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: vapor/swiftly-action@v0.2
      - run: |
          swiftly install --assume-yes --use --post-install-file "${HOME}/.swiftly-postinstall-cmds.sh"
          if [[ -f "${HOME}/.swiftly-postinstall-cmds.sh" ]]; then
            if [[ "$(id -un)" == 'root' ]]; then
              env DEBIAN_FRONTEND=noninteractive bash "${HOME}/.swiftly-postinstall-cmds.sh"
            else
              sudo env DEBIAN_FRONTEND=noninteractive bash "${HOME}/.swiftly-postinstall-cmds.sh" # use the current value of HOME, not root's
            fi
            rm "${HOME}/.swiftly-postinstall-cmds.sh"
          fi
      - name: Install Swift WebAssembly SDK
        id: setup-sdk
        run: ./setup-swift-sdk.sh

      - name: Install WebAssembly optimization tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen

      - name: Build Swift/Wasm bundle
        run: swiftly run swift package --swift-sdk ${{ steps.setup-sdk.outputs.SWIFT_SDK_ID }} js -c release

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Publish dist to deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: deploy
          force_orphan: true
