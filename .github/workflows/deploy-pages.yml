name: Deploy Pages Branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Swift WebAssembly SDK
        id: install-swift-sdk
        run: |
          set -euo pipefail
          version="$(swift --version | sed -n 's/^Swift version \([0-9.]*\).*/\1/p')"
          tag="swift-${version}-RELEASE"
          url="https://download.swift.org/swift-${version}-release/wasm-sdk/${tag}/${tag}_wasm.artifactbundle.tar.gz"
          archive="$(mktemp --suffix=.artifactbundle.tar.gz)"
          curl -fsSL "$url" -o "$archive"
          swift sdk install "$archive"
          rm -f "$archive"
          echo "SWIFT_SDK_ID=${tag}_wasm" >> $GITHUB_OUTPUT

      - name: Install WebAssembly optimization tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen

      - name: Build Swift/Wasm bundle
        run: swift package --swift-sdk "${{ steps.install-swift-sdk.outputs.SWIFT_SDK_ID }}" js -c release

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Publish dist to deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: deploy
          force_orphan: true
